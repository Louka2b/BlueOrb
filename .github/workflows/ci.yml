name: Cross-Platform Build (macOS ARM64, Linux, Windows x86_64)

on:
  push:
  pull_request:

jobs:
  toolchain-and-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
            artifact: BlueOrb-Installer-macOS-ARM64
          - os: ubuntu-latest   # Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            artifact: BlueOrb-Installer-Linux-x86_64
          - os: windows-latest  # Windows (x86_64)
            target: x86_64-pc-windows-msvc
            artifact: BlueOrb-Installer-Windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM EABI Toolchain & GUI Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            clang \
            pkg-config \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libfontconfig1-dev

      - name: Install ARM EABI Toolchain (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          brew install arm-none-eabi-binutils arm-none-eabi-gcc || brew install --cask gcc-arm-embedded

      - name: Install ARM EABI Toolchain (Windows x86_64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gcc-arm-embedded llvm --no-progress -y

      - name: Build & Test BlueOrb CLI, Launcher & GUI Installer
        run: |
          cargo build --release --manifest-path tools/blueorb/Cargo.toml
          cargo test --release --manifest-path tools/blueorb/Cargo.toml
          cargo build --release --manifest-path tools/launcher/Cargo.toml
          cargo build --release --manifest-path tools/installer/Cargo.toml

      - name: Package Cross-Platform GUI Installer Bundle
        shell: pwsh
        run: |
          ./blueorb.ps1 doctor
          ./blueorb.ps1 installer --no-launch

      - name: Upload GUI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/BlueOrb Installer*
