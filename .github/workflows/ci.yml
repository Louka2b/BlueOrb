name: Cross-Platform Build (macOS ARM64, Linux, Windows x86_64)

on:
  push:
  pull_request:

jobs:
  toolchain-and-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
          - os: ubuntu-latest   # Linux (x86_64)
            target: x86_64-unknown-linux-gnu
          - os: windows-latest  # Windows (x86_64)
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM EABI Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi g++-arm-none-eabi clang

      - name: Install ARM EABI Toolchain (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          brew install arm-none-eabi-binutils arm-none-eabi-gcc || brew install --cask gcc-arm-embedded

      - name: Install ARM EABI Toolchain (Windows x86_64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gcc-arm-embedded llvm --no-progress -y

      - name: Build BlueOrb CLI
        run: cargo build --release --manifest-path tools/blueorb/Cargo.toml

      - name: Verify Toolchain Detection (blueorb doctor)
        shell: pwsh
        run: ./blueorb.ps1 doctor
