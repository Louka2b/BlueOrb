name: Cross-Platform Build & Legal GUI Auto-Release (macOS ARM64, Linux, Windows x86_64)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
            archive: BlueOrb-macOS-AppleSilicon.zip
          - os: ubuntu-latest   # Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            archive: BlueOrb-Linux-x86_64.tar.gz
          - os: windows-latest  # Windows (x86_64)
            target: x86_64-pc-windows-msvc
            archive: BlueOrb-Windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Latest Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/blueorb
            tools/launcher
            tools/installer

      - name: Install System Libraries & ARM EABI Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Install ARM EABI Toolchain (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          brew install arm-none-eabi-binutils arm-none-eabi-gcc || brew install --cask gcc-arm-embedded

      - name: Install ARM EABI Toolchain & LLVM (Windows x86_64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gcc-arm-embedded llvm --no-progress -y

      - name: Build & Test BlueOrb CLI, Launcher & Installer
        run: |
          cargo build --release --manifest-path tools/blueorb/Cargo.toml
          cargo test --release --manifest-path tools/blueorb/Cargo.toml
          cargo build --release --manifest-path tools/launcher/Cargo.toml
          cargo build --release --manifest-path tools/installer/Cargo.toml

      - name: Verify ARM Toolchain (Doctor)
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ".\tools\blueorb\target\release\blueorb.exe" doctor
          } else {
            & "./tools/blueorb/target/release/blueorb" doctor
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build 100% Legal Zero-ROM Standalone BlueOrb GUI App
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ".\tools\blueorb\target\release\blueorb.exe" release
          } else {
            & "./tools/blueorb/target/release/blueorb" release
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Cross-Platform GUI Installer Bundle
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ".\tools\blueorb\target\release\blueorb.exe" installer --no-launch
          } else {
            & "./tools/blueorb/target/release/blueorb" installer --no-launch
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Archive & Smoke-Test Binary (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets dmg-stage
          xattr -cr "dist/BlueOrb.app"
          codesign --verify --deep "dist/BlueOrb.app"
          "dist/BlueOrb.app/Contents/MacOS/BlueOrb" --test-pattern --headless 1 --mute
          ditto -c -k --keepParent "dist/BlueOrb.app" "release-assets/${{ matrix.archive }}"
          cp -R "dist/BlueOrb.app" "dmg-stage/"
          ln -s /Applications "dmg-stage/Applications"
          hdiutil create -volname "BlueOrb" -srcfolder "dmg-stage" -ov -format UDZO "release-assets/BlueOrb-macOS-AppleSilicon.dmg"

      - name: Package Archive (Linux x86_64)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/${{ matrix.archive }}" -C dist BlueOrb

      - name: Package Archive & Smoke-Test Binary (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\BlueOrb\BlueOrb.exe")) {
            Write-Error "dist\BlueOrb\BlueOrb.exe not found!"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          & ".\dist\BlueOrb\BlueOrb.exe" --test-pattern --headless 1 --mute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path ".\dist\BlueOrb\*" -DestinationPath "release-assets\${{ matrix.archive }}" -Force

      - name: Upload Legal Standalone App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            release-assets/${{ matrix.archive }}
            release-assets/BlueOrb-macOS-*

  auto-release:
    name: Publish Legal GUI Release
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Archives
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Determine Release Tag & Title
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=BlueOrb ${GITHUB_REF_NAME} — Native Standalone Launcher (Windows, macOS, Linux)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=BlueOrb — Native Standalone Launcher (Windows, macOS Apple Silicon, Linux)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          make_latest: true
          prerelease: false
          files: release-files/*
          body: |
            ## BlueOrb — Native AOT Recompiler & HD / Ultrawide Runtime (Zero Terminal)

            Download the build for your system:
            - **Windows (x64)** : `BlueOrb-Windows-x64.zip` — extract and run **`BlueOrb.exe`**
            - **macOS (Apple Silicon M1–M5)** : `BlueOrb-macOS-AppleSilicon.dmg` (drag **`BlueOrb.app`** to **Applications**) or `BlueOrb-macOS-AppleSilicon.zip` *(if opened outside `/Applications`, BlueOrb also offers to move itself there automatically; on first launch allow it in System Settings -> Privacy & Security -> Open Anyway)*
            - **Linux (x64 / Steam Deck)** : `BlueOrb-Linux-x86_64.tar.gz` — extract and run **`./BlueOrb`**

            ### How It Works
            1. **First launch**: drop or select your own **decrypted `.3ds` ROM** in the launcher window.
            2. **Automatic native build**: BlueOrb recompiles the game into native machine code for your CPU (downloads a portable `zig cc` compiler automatically if none is installed), upgrades the app/window icon to your ROM's official game icon once built, and auto-launches the game.
            3. **Every launch after**: opening **`BlueOrb`** boots straight into your game.
            4. **Clean Cache**: use **`Clean Cache`** in the launcher bar (or **System & Cheats -> Clean Residual Build Files…** inside `Esc`) anytime to remove temporary build caches while preserving saves.

            ### Hotkeys
            - **`Esc`** : Open settings & save states overlay
            - **`F6`** : Cycle top screen aspect ratio (`5:3` -> `16:9` -> `21:9 Ultrawide` -> `32:9`)
            - **`F7`** : Toggle detached dual-window touch screen
            - **`F11`** : Fullscreen

            > **Legal Notice**: BlueOrb contains **zero** copyrighted Pokémon / Nintendo / Game Freak code, ROM bytes, icons, or assets. You must provide your own legally dumped, decrypted Nintendo 3DS `.3ds` ROM.
