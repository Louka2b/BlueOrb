[package]
name = "blueorb-installer"
version = "0.2.0"
edition = "2021"
description = "Installateur graphique natif BlueOrb — Recompilateur AOT Pokémon Saphir Alpha"

[[bin]]
name = "blueorb-installer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
